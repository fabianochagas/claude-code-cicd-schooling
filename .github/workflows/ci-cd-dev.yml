name: CI/CD — Development

on:
  push:
    branches: [develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── Job 1: Tests & Static Analysis ────────────────────────────────────────
  test:
    name: Tests & Static Analysis
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pcov
          coverage: pcov

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.ci .env
          php artisan key:generate

      - name: Run migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: php artisan migrate --force

      - name: Run Pest
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: php artisan test --parallel --coverage --min=80

      - name: Run Larastan
        run: ./vendor/bin/phpstan analyse --memory-limit=512M

  # ─── Job 2: Build & Push Docker Image ──────────────────────────────────────
  build:
    name: Build & Push Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 3: Deploy to Development ──────────────────────────────────────────
  deploy:
    name: Deploy to Development
    needs: build
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Run migrations
        run: |
          docker run --rm \
            -e APP_ENV=development \
            -e APP_KEY=${{ secrets.DEV_APP_KEY }} \
            -e DB_HOST=${{ secrets.DEV_DB_HOST }} \
            -e DB_PORT=5432 \
            -e DB_DATABASE=${{ secrets.DEV_DB_NAME }} \
            -e DB_USERNAME=${{ secrets.DEV_DB_USER }} \
            -e DB_PASSWORD=${{ secrets.DEV_DB_PASSWORD }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }} \
            php artisan migrate --force

      - name: Swap container on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
            docker stop app-dev || true
            docker rm app-dev || true
            docker run -d \
              --name app-dev \
              --restart unless-stopped \
              -p 80:80 \
              -e APP_ENV=development \
              -e APP_KEY=${{ secrets.DEV_APP_KEY }} \
              -e DB_HOST=${{ secrets.DEV_DB_HOST }} \
              -e DB_DATABASE=${{ secrets.DEV_DB_NAME }} \
              -e DB_USERNAME=${{ secrets.DEV_DB_USER }} \
              -e DB_PASSWORD=${{ secrets.DEV_DB_PASSWORD }} \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
            docker image prune -f
